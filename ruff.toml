# Правила линтера. Сам ruff в окружение программы не ставится (pip кладёт в
# .venv\Scripts лишний .exe, см. правило про антивирус); гонять его отдельно:
#     pipx run ruff check .        или        uvx ruff check .
#
# Что ловим и зачем:
#   E, F, W  — синтаксис, неиспользуемые имена и импорты, пробелы;
#   B        — частые ловушки (изменяемое значение по умолчанию, except без re-raise);
#   BLE      — голый `except Exception: pass`: молчаливое проглатывание прячет
#              поломки; где оно осознанное — `# noqa: BLE001` с причиной;
#   SLF      — обращение к чужому `_имени`: правило 6 из CLAUDE.md, «чужое
#              приватное не трогать» — если понадобилось, имя становится дверью.
line-length = 100
target-version = "py312"
extend-exclude = ["python", ".venv", "ffmpeg", "models", "data", "hagen-themes", "_backup"]

[lint]
select = ["E", "F", "W", "B", "BLE", "SLF"]
ignore = [
    "E501",   # длина строки — русские тексты сообщений длиннее ста знаков
    "E402",   # импорты после sys.path.insert в проверках и после ленивых блоков
    "B008",   # вызов в значении по умолчанию — в FastAPI это норма
]

[lint.per-file-ignores]
# Проверки заглядывают во внутренности нарочно: подменяют и щупают.
"tests/*" = ["SLF001", "BLE001"]
"tools/*" = ["BLE001"]
